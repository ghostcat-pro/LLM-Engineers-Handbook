# Conservative local QLoRA profile for RTX 3060 12GB.
# This config is for the local-first training phase, not the legacy SageMaker pipeline.

runtime:
  device: cuda
  gpu: RTX 3060
  vram_gb: 12
  offline_only: true

model:
  base_model: models/mistral-7b
  load_in_4bit: true
  max_seq_length: 1024
  chat_template: chatml

lora:
  rank: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  stage: sft
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 2.0e-4
  warmup_steps: 10
  optimizer: paged_adamw_8bit
  logging_steps: 1
  save_strategy: epoch
  report_to: none

data:
  directory: data/training/datasets
  sft_train: data/training/datasets/sft_train.jsonl
  sft_test: data/training/datasets/sft_test.jsonl
  dpo_train: data/training/datasets/dpo_train.jsonl
  dpo_test: data/training/datasets/dpo_test.jsonl

output:
  directory: data/training/runs/mistral-7b-local-qlora
  push_to_hub: false
